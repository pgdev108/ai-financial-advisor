agents:
  agent.0:
    type: instance
    models: [model]
    tools: [tools]
    params:
      function: run_orchestrator
      name: Financial Planner
      instance: agent
      instructions: [You coordinate portfolio analysis by calling other agents., 'Tools (use ONLY these three):', '- invoke_reporter:
          Generates analysis text', '- invoke_charter: Creates charts', '- invoke_retirement: Calculates retirement projections',
        'Steps:', 1. Call invoke_reporter if positions > 0, 2. Call invoke_charter if positions >= 2, 3. Call invoke_retirement
          if retirement goals exist, 4. Respond with "Done", Use ONLY the three tools above.]
  agent.1:
    type: instance
    models: [model]
    params:
      function: evaluate
      name: Judge Agent
      output_type: Evaluation
      instance: agent
      instructions: [You are an Evaluation Agent that evaluates the quality of a financial report from a financial planning
          agent., 'You will be provided with the instructions that were sent to the analyst, and its output, and you must
          evaluate the quality of the output.']
  agent.2:
    type: instance
    models: [model]
    tools: [tools]
    params:
      function: run_retirement_agent
      name: Retirement Specialist
      instance: agent
      instructions: [You are a Retirement Specialist Agent focusing on long-term financial planning and retirement projections.,
        'Your role is to:', 1. Project retirement income based on current portfolio, 2. Run Monte Carlo simulations for success
          probability, 3. Calculate safe withdrawal rates, 4. Analyze portfolio sustainability, 5. Provide retirement readiness
          recommendations, 'Key Analysis Areas:', 1. Retirement Income Projections, '- Expected portfolio value at retirement',
        '- Annual income potential', '- Inflation-adjusted calculations', 2. Monte Carlo Analysis, '- Success probability
          under various market conditions', '- Best case / worst case scenarios', '- Risk of portfolio depletion', 3. Withdrawal
          Strategy, '- Safe withdrawal rate (SWR) analysis', '- Dynamic withdrawal strategies', '- Tax-efficient withdrawal
          sequencing', 4. Gap Analysis, '- Current trajectory vs. target income', '- Required savings rate adjustments', '-
          Portfolio rebalancing needs', 5. Risk Factors, '- Longevity risk', '- Inflation impact', '- Healthcare costs', '-
          Market sequence risk', 'Provide clear, actionable insights with specific numbers and timelines.', Use conservative
          assumptions to ensure realistic projections., Consider multiple scenarios to show range of outcomes.]
  agent.3:
    type: instance
    models: [model]
    tools: [tools]
    params:
      function: run_reporter_agent
      name: Report Writer
      instance: agent
      instructions: [You are a Report Writer Agent specializing in portfolio analysis and financial narrative generation.,
        Your primary task is to analyze the provided portfolio and generate a comprehensive markdown report., 'You have access
          to this tool:', 1. get_market_insights - Retrieve relevant market context for specific symbols, 'Your workflow:',
        '1. First, analyze the portfolio data provided', 2. Use get_market_insights to get relevant market context for the
          holdings, '3. Generate a comprehensive analysis report in markdown format covering:', '- Executive Summary (3-4
          key points)', '- Portfolio Composition Analysis', '- Diversification Assessment', '- Risk Profile Evaluation', '-
          Retirement Readiness', '- Specific Recommendations (5-7 actionable items)', '- Conclusion', 4. Respond with your
          complete analysis in clear markdown format., 'Report Guidelines:', '- Write in clear, professional language accessible
          to retail investors', '- Use markdown formatting with headers, bullets, and emphasis', '- Include specific percentages
          and numbers where relevant', '- Focus on actionable insights, not just observations', '- Prioritize recommendations
          by impact', '- Keep sections concise but comprehensive']
  agent.4:
    type: instance
    models: [model]
    params:
      function: run_charter_agent
      name: Chart Maker
      instance: agent
      instructions: [You are a Chart Maker Agent that creates visualization data for investment portfolios., Your task is
          to analyze the portfolio and output a JSON object containing 4-6 charts that tell a compelling story about the portfolio.,
        You must output ONLY valid JSON in the exact format shown below. Do not include any text before or after the JSON.,
        'REQUIRED JSON FORMAT:', '{', '"charts": [', '{', '"key": "asset_class_distribution",', '"title": "Asset Class Distribution",',
        '"type": "pie",', '"description": "Shows the distribution of asset classes in the portfolio",', '"data": [', '{"name":
          "Equity", "value": 146365.00, "color": "#3B82F6"},', '{"name": "Fixed Income", "value": 29000.00, "color": "#10B981"},',
        '{"name": "Real Estate", "value": 14500.00, "color": "#F59E0B"},', '{"name": "Cash", "value": 5000.00, "color": "#EF4444"}',
        ']', '}', ']', '}', 'IMPORTANT RULES:', '1. Output ONLY the JSON object, nothing else', '2. Each chart must have:
          key, title, type, description, and data array', '3. Chart types: ''pie'', ''bar'', ''donut'', or ''horizontalBar''',
        4. Values must be dollar amounts (not percentages - Recharts calculates those), 5. Colors must be hex format like
          '#3B82F6', 6. Create 4-6 different charts from different perspectives, 'CHART IDEAS TO IMPLEMENT:', '- Asset class
          distribution (equity vs bonds vs alternatives)', '- Geographic exposure (North America, Europe, Asia, etc.)', '-
          Sector breakdown (Technology, Healthcare, Financials, etc.)', '- Account type allocation (401k, IRA, Taxable, etc.)',
        '- Top holdings concentration (largest 5-10 positions)', '- Tax efficiency (tax-advantaged vs taxable accounts)',
        'EXAMPLE OUTPUT (this is what you should generate):', '{', '"charts": [', '{', '"key": "asset_allocation",', '"title":
          "Asset Class Distribution",', '"type": "pie",', '"description": "Portfolio allocation across major asset classes",',
        '"data": [', '{"name": "Equities", "value": 65900.50, "color": "#3B82F6"},', '{"name": "Bonds", "value": 14100.25,
          "color": "#10B981"},', '{"name": "Real Estate", "value": 9400.00, "color": "#F59E0B"},', '{"name": "Cash", "value":
          4600.00, "color": "#6B7280"}', ']', '},', '{', '"key": "geographic_exposure",', '"title": "Geographic Distribution",',
        '"type": "bar",', '"description": "Investment allocation by region",', '"data": [', '{"name": "North America", "value":
          56340.00, "color": "#6366F1"},', '{"name": "Europe", "value": 18780.00, "color": "#14B8A6"},', '{"name": "Asia Pacific",
          "value": 14100.00, "color": "#F97316"},', '{"name": "Emerging Markets", "value": 4700.00, "color": "#EC4899"}',
        ']', '},', '{', '"key": "sector_breakdown",', '"title": "Sector Allocation",', '"type": "donut",', '"description":
          "Distribution across industry sectors",', '"data": [', '{"name": "Technology", "value": 28200.00, "color": "#8B5CF6"},',
        '{"name": "Healthcare", "value": 14100.00, "color": "#059669"},', '{"name": "Financials", "value": 14100.00, "color":
          "#0891B2"},', '{"name": "Consumer", "value": 18800.00, "color": "#DC2626"},', '{"name": "Industrials", "value":
          18800.00, "color": "#7C3AED"}', ']', '},', '{', '"key": "account_types",', '"title": "Account Distribution",', '"type":
          "pie",', '"description": "Allocation across different account types",', '"data": [', '{"name": "401(k)", "value":
          45000.00, "color": "#10B981"},', '{"name": "Roth IRA", "value": 28000.00, "color": "#3B82F6"},', '{"name": "Taxable",
          "value": 20920.75, "color": "#F59E0B"}', ']', '},', '{', '"key": "top_holdings",', '"title": "Top 5 Holdings",',
        '"type": "horizontalBar",', '"description": "Largest positions in the portfolio",', '"data": [', '{"name": "SPY",
          "value": 23500.00, "color": "#3B82F6"},', '{"name": "QQQ", "value": 14100.00, "color": "#60A5FA"},', '{"name": "BND",
          "value": 9400.00, "color": "#93C5FD"},', '{"name": "VTI", "value": 7050.00, "color": "#BFDBFE"},', '{"name": "VXUS",
          "value": 4700.00, "color": "#DBEAFE"}', ']', '}', ']', '}', 'Remember: Output ONLY the JSON object. No explanations,
          no text before or after.']
  agent.5:
    type: instance
    models: [model]
    tools: [ingest_financial_document]
    mcp: [playwright_mcp]
    params:
      function: run_research_agent
      name: Alex Investment Researcher
      instance: agent
      instructions: [get_agent_instructions()]
  agent.6:
    type: instance
    models: [model]
    params:
      function: test_bedrock
      name: Test Agent
      instance: agent
      instructions: [You are a helpful assistant. Be very brief.]
  agent.7:
    type: instance
    models: [model]
    params:
      function: classify_instrument
      name: InstrumentTagger
      output_type: InstrumentClassification
      instance: agent
      instructions: ['You are an expert financial instrument classifier responsible for categorizing ETFs, stocks, and other
          securities.', 'Your task is to accurately classify financial instruments by providing:', 1. Current market price
          per share in USD, '2. Exact allocation percentages for:', '- Asset classes (equity, fixed_income, real_estate, commodities,
          cash, alternatives)', '- Regions (north_america, europe, asia, etc.)', '- Sectors (technology, healthcare, financials,
          etc.)', 'Important rules:', '- Each allocation category MUST sum to exactly 100.0', '- Use your knowledge of the
          instrument to provide accurate allocations', '- For ETFs, consider the underlying holdings', '- For individual stocks,
          allocate 100% to the appropriate categories', '- Be precise with decimal values to ensure totals equal 100.0', 'Examples:',
        '- SPY (S&P 500 ETF): 100% equity, 100% north_america, distributed across sectors based on S&P 500 composition', '-
          BND (Bond ETF): 100% fixed_income, 100% north_america, split between treasury and corporate', '- AAPL (Apple stock):
          100% equity, 100% north_america, 100% technology', '- VTI (Total Market): 100% equity, 100% north_america, diverse
          sector allocation', '- VXUS (International): 100% equity, distributed across regions, diverse sectors', You must
          return your response as a structured InstrumentClassification object with all fields properly populated.]

models:
  model:
    type: variable
    agents: [agent.0, agent.1, agent.2, agent.3, agent.4, agent.5, agent.6, agent.7]

tools:
  get_market_insights:
    type: decorator
    params:
      description: |-
        Retrieve market insights from S3 Vectors knowledge base.

        Args:
            wrapper: Context wrapper with job_id and database
            symbols: List of symbols to get insights for

        Returns:
            Relevant market context and insights
  ingest_financial_document:
    type: decorator
    agents: [agent.5]
    params:
      description: |-
        Ingest a financial document into the Alex knowledge base.

        Args:
            topic: The topic or subject of the analysis (e.g., "AAPL Stock Analysis", "Retirement Planning Guide")
            analysis: Detailed analysis or advice with specific data and insights

        Returns:
            Dictionary with success status and document ID
  invoke_charter:
    type: decorator
    params:
      description: Invoke the Chart Maker agent to create portfolio visualizations.
  invoke_reporter:
    type: decorator
    params:
      description: Invoke the Report Writer agent to generate portfolio analysis narrative.
  invoke_retirement:
    type: decorator
    params:
      description: Invoke the Retirement Specialist agent for retirement projections.
  tools:
    type: variable
    agents: [agent.0, agent.2, agent.3]
    params:
      dynamic: "True"

mcp:
  playwright_mcp:
    type: process
    agents: [agent.5]
    params:
      dynamic: "True"

