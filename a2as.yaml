files:
  .env.local:
    type: literal
    actions: [read]
    params:
      caller: [build_frontend]
      path: [frontend_dir]
  .env.production:
    type: literal
    actions: [read]
    params:
      caller: [build_frontend]
      path: [frontend_dir]
  .env.production.local:
    type: literal
    actions: [read]
    params:
      caller: [build_frontend]
      path: [frontend_dir]
  .terraform:
    type: literal
    actions: [read]
    params:
      caller: [deploy_terraform]
      path: [terraform_dir]
  /.dockerenv:
    type: literal
    actions: [read]
    params:
      caller: [create_playwright_mcp_server, health]
  /root/.cache/ms-playwright/chromium-*/chrome-linux:
    type: pattern
    actions: [read]
    params:
      patterns: [chrome]
      caller: [create_playwright_mcp_server]
  /run/.containerenv:
    type: literal
    actions: [read]
    params:
      caller: [health]

processes:
  uv:
    type: shell
    actions: [exec]
    args: [[run, run_migrations.py], [run, seed_data.py]]
    params:
      caller: [subprocess.run]
      shell: ["False", "False"]
